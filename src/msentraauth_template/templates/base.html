<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}MS Entra Auth{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>

<body>
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
  <header class="site-header">
    <a class="brand" href="{{ url_for('web.home') }}">MS Entra Auth</a>
    <nav aria-label="Navegação principal">
      <a href="{{ url_for('web.home') }}">Início</a>
      <a href="{{ url_for('graph.profile') }}">Perfil</a>
    </nav>
  </header>
  <main id="conteudo" class="container" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Aplicação de referência (autenticação pela extensão, autorização pela aplicação)</p>
  </footer>
</body>

</html>

services:
  app:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_TLS_REQUIRED: "false"
    ports:
      - "5000:8000"
    depends_on:
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:

name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test with full coverage
        run: pytest

  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Type check
        run: mypy src tests
      - name: Static security audit
        run: bandit -c pyproject.toml -r src
      - name: Dependency audit
        run: pip-audit .

  redis-integration:
    name: Real Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Exercise factory, readiness and atomic storage
        env:
          APP_ENV: development
          APP_SECRET_KEY: ci-session-secret-with-at-least-32-chars
          APP_BASE_URL: http://localhost:5000
          APP_TRUSTED_HOSTS: localhost,127.0.0.1
          APP_LOG_FORMAT: json
          MS_ENTRA_CLIENT_ID: ci-client-id
          MS_ENTRA_CLIENT_SECRET: ci-client-secret-with-at-least-24-chars
          MS_ENTRA_TENANT_ID: ci.example.com
          MS_ENTRA_REDIRECT_URI: http://localhost:5000/auth/callback
          REDIS_URL: redis://localhost:6379/0
          REDIS_TLS_REQUIRED: "false"
          SESSION_COOKIE_SECURE: "false"
          WTF_CSRF_ENABLED: "false"
        run: |
          python - <<'PY'
          from msentraauth_template import create_app
          from msentraauth_template.storage import RedisAuthStorage

          app = create_app()
          client = app.test_client()
          assert client.get("/health/live").status_code == 200
          assert client.get("/health/ready").status_code == 200
          storage = RedisAuthStorage(app.extensions["template_redis"])
          storage.save("integration", b"once", ttl=30)
          assert storage.take("integration") == b"once"
          assert storage.take("integration") is None
          PY

  package:
    name: Build and inspect application package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build artifacts
        run: python -m build
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Inspect artifacts
        env:
          DIST_DIR: dist
        run: pytest tests/test_distribution.py --no-cov
      - name: Install wheel in a clean environment
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install --upgrade pip
          .package-venv/bin/python -m pip install dist/*.whl
          .package-venv/bin/python -m pip check
          .package-venv/bin/python - <<'PY'
          import msentraauth_template
          from importlib.metadata import version
          assert callable(msentraauth_template.create_app)
          assert version("msentraauth-flask-template") == "1.0.0"
          PY

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build --tag msentraauth-flask-template:ci .

name: Template CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/generator.constraints.txt
      - name: Install pinned generator tooling
        run: >-
          python -m pip install
          --constraint requirements/generator.constraints.txt
          copier jinja2 mypy pytest pyyaml ruff
      - run: ruff check template_tests scripts/check_generated_project.py
      - run: mypy template_tests scripts/check_generated_project.py
      - run: pytest -q

  generated-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project_name: Acme Portal
            project_slug: acme-portal
            package_name: acme_portal
            graph: false
            python: "3.12"
            container: true
          - project_name: Portal Operacional Brasil
            project_slug: portal-operacional-brasil
            package_name: portal_operacional_brasil
            graph: true
            python: "3.13"
            container: false
          - project_name: Ops Web
            project_slug: ops-web
            package_name: ops_core
            graph: false
            python: "3.14"
            container: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements/generator.constraints.txt
            template/requirements/*.constraints.txt
      - name: Install Copier
        run: >-
          python -m pip install
          --constraint requirements/generator.constraints.txt
          copier
      - name: Render with the official Copier engine
        run: |
          copier copy --trust --defaults \
            --data project_name="${{ matrix.project_name }}" \
            --data project_slug="${{ matrix.project_slug }}" \
            --data package_name="${{ matrix.package_name }}" \
            --data include_graph_example=${{ matrix.graph }} \
            --data python_version="${{ matrix.python }}" \
            . rendered
          test -f rendered/.copier-answers.yml
      - run: python scripts/check_generated_project.py rendered
      - name: Install generated project and pinned quality tooling
        run: |
          python -m pip install \
            --constraint rendered/requirements/build.constraints.txt \
            pip==26.1.2
          python -m pip install \
            --constraint rendered/requirements/development.constraints.txt \
            -e './rendered[dev]'
          python -m pip check
      - run: python -m compileall -q src tests scripts
        working-directory: rendered
      - run: ruff check src tests scripts gunicorn.conf.py wsgi.py
        working-directory: rendered
      - run: mypy src
        working-directory: rendered
      - run: pytest
        working-directory: rendered
      - run: bandit -q -r src
        working-directory: rendered
      - run: python -m build
        working-directory: rendered
      - name: Validate Compose configuration
        run: |
          cp rendered/.env.example rendered/.env
          docker compose --project-directory rendered config --quiet
      - name: Build generated container
        if: matrix.container
        run: docker build --tag generated-template:ci rendered

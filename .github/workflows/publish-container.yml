name: Publish container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Versão semântica existente no pyproject.toml
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-container-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build, publish and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate versioned source
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          raw_version="${RELEASE_TAG:-${MANUAL_VERSION:-}}"
          version="${raw_version#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Versão inválida: $raw_version" >&2
            exit 1
          fi

          package_version="$(python - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"

          if [[ "$version" != "$package_version" ]]; then
            echo "A versão solicitada ($version) difere do pyproject.toml ($package_version)." >&2
            exit 1
          fi

          source_tag="${RELEASE_TAG:-v$version}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" \
            && "$GITHUB_REF" != "refs/heads/prod" \
            && "$GITHUB_REF" != "refs/tags/$source_tag" ]]; then
            echo "Publicação manual só pode partir da branch prod ou da tag $source_tag." >&2
            exit 1
          fi

          git fetch --force --tags origin prod
          tag_commit="$(git rev-list -n 1 "$source_tag" 2>/dev/null || true)"
          head_commit="$(git rev-parse HEAD)"

          if [[ -z "$tag_commit" ]]; then
            echo "A tag versionada $source_tag não existe." >&2
            exit 1
          fi
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "O ref selecionado não aponta para o commit da tag $source_tag." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" "origin/prod"; then
            echo "A tag $source_tag não pertence ao histórico da branch prod." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "source-tag=$source_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Build and validate Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.4.4,<1.6" "twine>=6.2,<7"
          python -m build
          python -m twine check dist/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke-test candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: msentraauth-flask-template:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test candidate image
        run: |
          set -euo pipefail

          network="msentra-smoke-${GITHUB_RUN_ID}"
          redis_container="msentra-redis-${GITHUB_RUN_ID}"
          app_container="msentra-app-${GITHUB_RUN_ID}"

          cleanup() {
            docker rm -f "$app_container" "$redis_container" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network"
          docker run --detach --name "$redis_container" --network "$network" redis:8-alpine

          docker run --detach \
            --name "$app_container" \
            --network "$network" \
            --publish 18000:8000 \
            --read-only \
            --tmpfs /tmp:size=64m,noexec,nosuid \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env APP_ENV=development \
            --env APP_SECRET_KEY=container-smoke-session-secret-with-at-least-32-characters \
            --env APP_BASE_URL=http://localhost:18000 \
            --env APP_TRUSTED_HOSTS=localhost,127.0.0.1 \
            --env APP_LOG_FORMAT=json \
            --env MS_ENTRA_CLIENT_ID=container-smoke-client-id \
            --env MS_ENTRA_CLIENT_SECRET=container-smoke-client-secret-with-at-least-24-characters \
            --env MS_ENTRA_TENANT_ID=container-smoke.example.com \
            --env MS_ENTRA_REDIRECT_URI=http://localhost:18000/auth/callback \
            --env MS_ENTRA_SCOPES=User.Read \
            --env REDIS_URL=redis://$redis_container:6379/0 \
            --env REDIS_TLS_REQUIRED=false \
            --env SESSION_COOKIE_SECURE=false \
            --env WTF_CSRF_ENABLED=false \
            msentraauth-flask-template:release-candidate

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18000/health/live >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:18000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs "$app_container"
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=MS Entra Auth Flask Template
            org.opencontainers.image.description=Template Flask de referência com Microsoft Entra ID, Redis e Microsoft Graph
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}" >/dev/null

      - name: Attach Python package to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ steps.version.outputs.source-tag }}
        run: gh release upload "$SOURCE_TAG" dist/* --clobber

      - name: Publish summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_TAG: ${{ steps.version.outputs.source-tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## Imagem publicada"
            echo
            echo "- Imagem: \`${IMAGE_NAME}:${VERSION}\`"
            echo "- Fonte: \`${SOURCE_TAG}\` em \`${GITHUB_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Plataformas: \`linux/amd64\`, \`linux/arm64\`"
            echo "- SBOM e proveniência: incluídos"
            if [[ "$EVENT_NAME" == "release" ]]; then
              echo "- Pacote Python: wheel e sdist validados e anexados à Release"
            else
              echo "- Pacote Python: wheel e sdist validados"
            fi
            echo "- Smoke test do candidato: aprovado"
            echo "- Digest publicado: verificado"
          } >> "$GITHUB_STEP_SUMMARY"

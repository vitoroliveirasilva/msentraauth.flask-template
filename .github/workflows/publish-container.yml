name: Publish container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Versão semântica existente no pyproject.toml
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-container-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  resolve:
    name: Resolve immutable source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source-tag: ${{ steps.version.outputs.source-tag }}
      candidate-tag: ${{ steps.version.outputs.candidate-tag }}
    steps:
      - name: Checkout versioned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate versioned source
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          raw_version="${RELEASE_TAG:-${MANUAL_VERSION:-}}"
          version="${raw_version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Versão inválida: $raw_version" >&2
            exit 1
          fi
          package_version="$(python - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )"
          if [[ "$version" != "$package_version" ]]; then
            echo "A versão solicitada ($version) difere do pyproject.toml ($package_version)." >&2
            exit 1
          fi
          source_tag="${RELEASE_TAG:-v$version}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" \
            && "$GITHUB_REF" != "refs/heads/prod" \
            && "$GITHUB_REF" != "refs/tags/$source_tag" ]]; then
            echo "Publicação manual só pode partir da branch prod ou da tag $source_tag." >&2
            exit 1
          fi
          git fetch --force --tags origin prod
          tag_commit="$(git rev-list -n 1 "$source_tag" 2>/dev/null || true)"
          head_commit="$(git rev-parse HEAD)"
          if [[ -z "$tag_commit" ]]; then
            echo "A tag versionada $source_tag não existe." >&2
            exit 1
          fi
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "O ref selecionado não aponta para o commit da tag $source_tag." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/prod; then
            echo "A tag $source_tag não pertence ao histórico da branch prod." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source-tag=$source_tag" >> "$GITHUB_OUTPUT"
          echo "candidate-tag=candidate-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  package:
    name: Build and attest Python package
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout versioned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.constraints.txt
      - name: Install pinned pip
        run: >-
          python -m pip install
          --constraint requirements/build.constraints.txt
          pip==26.1.2
      - name: Install constrained build tooling
        run: >-
          python -m pip install
          --constraint requirements/development.constraints.txt
          -e ".[dev]"
      - name: Build and validate package once
        run: |
          python -m build
          python -m twine check dist/*
          DIST_DIR=dist pytest tests/test_distribution.py --no-cov
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Verify wheel in an isolated runtime environment
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install \
            --constraint requirements/build.constraints.txt \
            pip==26.1.2
          .package-venv/bin/python -m pip install \
            --constraint requirements/runtime.constraints.txt \
            dist/*.whl
          .package-venv/bin/python -m pip check
      - name: Generate reproducible runtime SBOM
        run: >-
          cyclonedx-py environment
          --output-reproducible
          --output-format JSON
          --output-file dist/python-environment.cdx.json
          .package-venv/bin/python
      - name: Generate package SBOM
        run: cyclonedx-py environment --output-format JSON --output-file dist/python-environment.cdx.json
      - name: Attest package checksums
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Upload immutable package materials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/python-environment.cdx.json
          if-no-files-found: error
          retention-days: 30

  image:
    name: Build multi-platform candidate once
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout versioned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.candidate-tag }}
          labels: |
            org.opencontainers.image.title=MS Entra Auth Flask Template
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  verify-image:
    name: Verify exact candidate digest
    needs: [resolve, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test exact digest on both platforms
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          redis_password="release-smoke-password-not-used-elsewhere"
          cleanup() {
            docker ps -aq --filter "name=msentra-app-" | xargs -r docker rm -f
            docker ps -aq --filter "name=msentra-redis-" | xargs -r docker rm -f
            docker network ls -q --filter "name=msentra-smoke-" \
              | xargs -r docker network rm
          }
          trap cleanup EXIT
          for platform in linux/amd64 linux/arm64; do
            suffix="${platform##*/}"
            network="msentra-smoke-${suffix}-${GITHUB_RUN_ID}"
            redis_container="msentra-redis-${suffix}-${GITHUB_RUN_ID}"
            app_container="msentra-app-${suffix}-${GITHUB_RUN_ID}"
            port=18000
            [[ "$suffix" == "arm64" ]] && port=18001
            docker network create --internal "$network"
            redis_args=(
              docker run --detach
              --name "$redis_container"
              --network "$network"
              redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
              redis-server --save "" --appendonly no --requirepass "$redis_password"
            )
            "${redis_args[@]}"
            app_args=(
              docker run --detach
              --platform "$platform"
              --name "$app_container"
              --network "$network"
              --publish "127.0.0.1:${port}:8000"
              --read-only
              --tmpfs /tmp:size=64m,noexec,nosuid,nodev
              --cap-drop ALL
              --pids-limit 256
              --memory 512m
              --cpus 1
              --security-opt no-new-privileges:true
              --env APP_ENV=development
              --env APP_SECRET_KEY=release-smoke-session-secret-with-at-least-32-characters
              --env "APP_BASE_URL=http://localhost:${port}"
              --env APP_TRUSTED_HOSTS=localhost,127.0.0.1
              --env APP_LOG_FORMAT=json
              --env MS_ENTRA_CLIENT_ID=release-smoke-client-id
              --env MS_ENTRA_CLIENT_SECRET=release-smoke-client-secret-with-at-least-24-characters
              --env MS_ENTRA_TENANT_ID=release-smoke.example.com
              --env "MS_ENTRA_REDIRECT_URI=http://localhost:${port}/auth/callback"
              --env MS_ENTRA_SCOPES=User.Read
              --env "REDIS_URL=redis://:${redis_password}@${redis_container}:6379/0"
              --env REDIS_TLS_REQUIRED=false
              --env SESSION_COOKIE_SECURE=false
              --env WTF_CSRF_ENABLED=false
              "$image_ref"
            )
            "${app_args[@]}"
            test "$(docker run --rm --platform "$platform" \
              --entrypoint id "$image_ref" -u)" = "10001"
            success=false
            for attempt in {1..45}; do
              if curl --fail --silent --show-error \
                "http://127.0.0.1:${port}/health/live" >/dev/null \
                && curl --fail --silent --show-error \
                  "http://127.0.0.1:${port}/health/ready" >/dev/null; then
                success=true
                break
              fi
              sleep 2
            done
            if [[ "$success" != true ]]; then
              docker logs "$app_container"
              exit 1
            fi
            docker rm -f "$app_container" "$redis_container"
            docker network rm "$network"
          done
      - name: Scan exact candidate digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln,secret,misconfig

  promote:
    name: Promote verified digest and attest image
    needs: [resolve, image, verify-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate semantic tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.resolve.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.resolve.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.resolve.outputs.version }}
            type=sha,prefix=sha-
      - name: Apply tags to the verified digest without rebuilding
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t tags <<< "$TAGS"
          args=()
          for tag in "${tags[@]}"; do
            [[ -n "$tag" ]] && args+=(--tag "$tag")
          done
          docker buildx imagetools create "${args[@]}" "${IMAGE_NAME}@${DIGEST}"
          for tag in "${tags[@]}"; do
            [[ -z "$tag" ]] && continue
            manifest_json="$(docker buildx imagetools inspect \
              "$tag" --format '{{json .Manifest}}')"
            actual="$(python -c \
              'import json,sys; print(json.load(sys.stdin)["digest"])' \
              <<< "$manifest_json")"
            test "$actual" = "$DIGEST"
          done
      - name: Attest promoted image digest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true

  attach-release:
    name: Attach the same package bytes to the release
    if: github.event_name == 'release'
    needs: [resolve, package, promote]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download immutable package materials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package-${{ github.sha }}
          path: release-assets
      - name: Attach package materials without overwriting
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ needs.resolve.outputs.source-tag }}
        run: gh release upload "$SOURCE_TAG" release-assets/*

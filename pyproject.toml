[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "msentraauth-flask-template"
version = "1.0.0"
description = "Aplicação Flask de referência para flask-ms-entra-auth com Redis e Microsoft Graph."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Vitor Oliveira" }]
keywords = ["flask", "microsoft-entra-id", "msal", "redis", "microsoft-graph"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "Flask>=3.1.3,<3.2",
  "Flask-WTF>=1.3,<2",
  "flask-ms-entra-auth>=1.0,<2",
  "gunicorn>=23,<27",
  "redis>=6.4,<9",
  "requests>=2.34,<3",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9.4,<2",
  "build>=1.4.4,<1.5",
  "fakeredis>=2.36,<3",
  "mypy>=2.3,<3",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "python-dotenv>=1.1,<2",
  "ruff>=0.15.22,<1",
  "twine>=6.2,<7",
  "types-requests>=2.33,<3",
]

[project.urls]
Repository = "https://github.com/vitoroliveirasilva/msentraauth.flask-template"
Documentation = "https://github.com/vitoroliveirasilva/msentraauth.flask-template/tree/prod/docs"
Issues = "https://github.com/vitoroliveirasilva/msentraauth.flask-template/issues"
Security = "https://github.com/vitoroliveirasilva/msentraauth.flask-template/blob/prod/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["src/msentraauth_template"]

[tool.hatch.build.targets.sdist]
include = [
  "/.dockerignore",
  "/.editorconfig",
  "/.env.example",
  "/.gitattributes",
  "/.github/**/*.md",
  "/.github/**/*.yml",
  "/.gitignore",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/Dockerfile",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/compose.yaml",
  "/docs/**/*.md",
  "/gunicorn.conf.py",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
  "/wsgi.py",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
  "--cov=msentraauth_template",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=100",
]
testpaths = ["tests"]
markers = ["distribution: valida artefatos previamente construídos"]

[tool.coverage.run]
branch = true
source = ["msentraauth_template"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["msentraauth_template"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["msentraauth_template"]
show_error_codes = true
warn_unused_configs = true

[tool.bandit]
exclude_dirs = ["tests"]

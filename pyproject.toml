[project]
name = "msentraauth-flask-template-generator"
version = "2.0.0"
description = "Copier generator for production-oriented Flask applications with Microsoft Entra ID"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["template_tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["template_tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
